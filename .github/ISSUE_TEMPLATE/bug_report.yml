name: 问题报告 / Bug report
description: 部署或使用中遇到的问题 / Something does not work
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请确认没有贴出 API Key、管理员密码、配对码或服务器公网地址。安全问题请走私密漏洞报告，不要公开提交。
        Do not post API keys, admin passwords, pairing codes or public server addresses. Report security issues privately.
  - type: dropdown
    id: part
    attributes:
      label: 出问题的部分 / Affected part
      options: [服务端 Host, Windows 客户端, Mac 客户端, iOS 客户端, 文档 / Docs, 其他 / Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 发生了什么 / What happened
      description: 你做了什么，期望看到什么，实际看到了什么 / What you did, what you expected, what you saw
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 环境 / Environment
      description: 例如 Ubuntu 24.04 + Docker 29，Windows 11 客户端，Anthropic 格式 / e.g. Ubuntu 24.04 + Docker 29, Windows 11 client, Anthropic format
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志 / Logs
      description: Host 日志相关的几行（docker compose ... logs --tail 200 host），请先删掉敏感信息 / Relevant Host log lines, with secrets removed
      render: text
