org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.caching=false
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
# The repository may be cloned under a non-ASCII path. The shell has no NDK code.
android.overridePathCheck=true
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
