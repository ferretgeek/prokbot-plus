<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'">
<title>Grok Bot</title><link rel="stylesheet" href="connect.css"></head>
<body><main><img class="icon" src="icon.png" alt=""><p id="edition"></p><h1></h1><p class="lead"></p>
<form id="form" novalidate>
<label for="server"></label><input id="server" type="url" inputmode="url" placeholder="https://bot.example.com" required autocomplete="url" autocapitalize="off" spellcheck="false">
<label for="key"></label><input id="key" type="text" inputmode="url" maxlength="6" autocapitalize="characters" autocomplete="one-time-code" autocorrect="off" spellcheck="false">
<p id="status" role="status" aria-live="polite"></p>
<div class="actions"><button id="connect" type="submit"></button></div>
</form>
<section id="paired" hidden>
<label class="switch"><span id="background-label"></span><input id="background" type="checkbox" role="switch"></label>
<p class="hint" id="background-hint"></p>
<div class="actions"><button id="disconnect" type="button" class="secondary"></button><button id="workspace" type="button"></button></div>
</section>
</main>
<script src="boot-data.js"></script>
<script type="module" src="connect.js"></script></body></html>
