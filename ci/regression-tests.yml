# Optional GitHub Actions workflow. See CONTRIBUTING.md before enabling it.
name: Regression tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - run: node ci/check-inputs.mjs
      - run: node --test "host/tests/*.test.mjs" "mac/tests/*.test.mjs" "windows/tests/*.test.mjs" "android/tests/*.test.mjs"
      - if: runner.os == 'Windows'
        working-directory: windows/installer
        run: go test ./...
      - if: runner.os == 'macOS'
        run: python3 ios/tests/ios-network.test.py
