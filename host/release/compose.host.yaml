name: grokbot-host
services:
  host:
    image: ${GROKBOT_HOST_IMAGE:-grokbot-host:local}
    init: true
    restart: unless-stopped
    ports:
      - "${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}:${GROKBOT_PUBLIC_PORT:-18080}:8000"
      - "${GROKBOT_LISTEN_ADDRESS:-127.0.0.1}:${GROKBOT_WEB_PUBLIC_PORT:-18081}:8001"
    environment:
      GROKBOT_PUBLIC_URL: ${GROKBOT_PUBLIC_URL:-}
      GROKBOT_BLOB_DB_QUICK_CHECK_MAX_BYTES: ${GROKBOT_BLOB_DB_QUICK_CHECK_MAX_BYTES:-}
      GROKBOT_DESKTOP_PARK_ENABLED: ${GROKBOT_DESKTOP_PARK_ENABLED:-}
      GROKBOT_DESKTOP_PARK_IDLE_MINUTES: ${GROKBOT_DESKTOP_PARK_IDLE_MINUTES:-}
      GROKBOT_DESKTOP_PARK_PRESSURE_IDLE_MINUTES: ${GROKBOT_DESKTOP_PARK_PRESSURE_IDLE_MINUTES:-}
      GROKBOT_DESKTOP_PARK_PRESSURE_AVAILABLE_PERCENT: ${GROKBOT_DESKTOP_PARK_PRESSURE_AVAILABLE_PERCENT:-}
      GROKBOT_DESKTOP_PARK_PRESSURE_PSI: ${GROKBOT_DESKTOP_PARK_PRESSURE_PSI:-}
      GROKBOT_DESKTOP_PARK_MAX_PER_TICK: ${GROKBOT_DESKTOP_PARK_MAX_PER_TICK:-}
      GROKBOT_DESKTOP_PARK_INTERVAL_MS: ${GROKBOT_DESKTOP_PARK_INTERVAL_MS:-}
      GROKBOT_PUBLIC_PORT: ${GROKBOT_PUBLIC_PORT:-18080}
      GROKBOT_WEB_PUBLIC_URL: ${GROKBOT_WEB_PUBLIC_URL:-}
      GROKBOT_WEB_PUBLIC_PORT: ${GROKBOT_WEB_PUBLIC_PORT:-18081}
      GROKBOT_REQUIRE_EXECUTION_NODE: "1"
      TZ: ${TZ:-Asia/Singapore}
    volumes:
      - host-data:/data
    stop_grace_period: 25s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  host-data:
    name: ${COMPOSE_PROJECT_NAME}_host-data
    external: ${PROKBOT_EXISTING_VOLUMES:-false}
